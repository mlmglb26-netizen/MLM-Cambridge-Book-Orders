<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambridge Books Order System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f0f4fc;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 1.5rem;
      color: #1e2a41;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-weight: 700;
      font-size: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header h1 i {
      color: #0f3b7a;
    }
    .header-actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: white;
      color: #1e2a41;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .btn-primary {
      background: #0f3b7a;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4f96;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 59, 122, 0.25);
    }
    .btn-success {
      background: #1a7a4a;
      color: white;
    }
    .btn-success:hover {
      background: #23945a;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #0f3b7a;
      color: #0f3b7a;
    }
    .btn-outline:hover {
      background: #0f3b7a;
      color: white;
    }
    .btn-danger {
      background: #b13e3e;
      color: white;
    }
    .btn-danger:hover {
      background: #c94a4a;
    }

    /* Search & Filter */
    .search-bar {
      background: white;
      padding: 1.2rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .search-bar input, .search-bar select {
      padding: 0.6rem 1rem;
      border: 1px solid #d4e0f0;
      border-radius: 30px;
      font-size: 0.95rem;
      background: #fafcff;
      flex: 1;
      min-width: 150px;
    }
    .search-bar input:focus, .search-bar select:focus {
      outline: none;
      border-color: #0f3b7a;
      box-shadow: 0 0 0 3px rgba(15, 59, 122, 0.1);
    }
    .search-bar .filter-group {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      flex: 2;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border-left: 4px solid #0f3b7a;
    }
    .stat-card .number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f3b7a;
    }
    .stat-card .label {
      font-size: 0.85rem;
      color: #5a6f92;
    }

    /* Level Grid */
    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .level-card {
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      border: 1px solid #e8eef8;
      transition: 0.2s;
    }
    .level-card:hover {
      box-shadow: 0 8px 24px rgba(15, 59, 122, 0.08);
      transform: translateY(-3px);
    }
    .level-card .level-title {
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eef4fe;
      padding-bottom: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .level-card .book-count {
      background: #eef4fe;
      padding: 0.1rem 0.8rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1f4a8f;
    }
    .level-card .book-list {
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #3a537a;
      margin: 0.5rem 0 1rem;
      padding-right: 0.5rem;
    }
    .level-card .book-list::-webkit-scrollbar {
      width: 4px;
    }
    .level-card .book-list::-webkit-scrollbar-thumb {
      background: #c6d8ef;
      border-radius: 10px;
    }
    .level-card .book-item {
      padding: 0.15rem 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #f5f8ff;
    }
    .level-card .book-item .price-tag {
      color: #1a7a4a;
      font-weight: 600;
    }
    .level-card .order-btn {
      width: 100%;
      padding: 0.7rem;
      background: #0f3b7a;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .level-card .order-btn:hover {
      background: #1d4f96;
      transform: scale(1.01);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: white;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      border-radius: 28px;
      padding: 2rem;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    }
    .modal .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #5a6f92;
      z-index: 10;
    }
    .modal h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .modal .level-tag {
      background: #e7effb;
      padding: 0.1rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1f4a8f;
    }
    .modal .form-group {
      margin: 1.2rem 0;
    }
    .modal .form-group label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
      color: #1d3457;
    }
    .modal .form-group input, .modal .form-group select {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #c6d8ef;
      border-radius: 20px;
      font-size: 1rem;
      background: #fafcff;
    }
    .book-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      max-height: 300px;
      overflow-y: auto;
      padding: 0.5rem;
      background: #f6f9ff;
      border-radius: 16px;
      border: 1px solid #e2ecfc;
    }
    .book-grid .book-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.4rem 0.6rem;
      border-radius: 10px;
      background: white;
      transition: 0.1s;
    }
    .book-grid .book-row:hover {
      background: #e7f0fe;
    }
    .book-grid .book-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0f3b7a;
      flex-shrink: 0;
    }
    .book-grid .book-row .book-title {
      flex: 1;
      font-size: 0.85rem;
    }
    .book-grid .book-row .qty-input {
      width: 55px;
      padding: 0.2rem 0.3rem;
      border: 1px solid #c6d8ef;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
    }
    .book-grid .book-row .price-display {
      font-weight: 600;
      color: #1a7a4a;
      font-size: 0.85rem;
      min-width: 50px;
      text-align: right;
    }
    .summary-bar {
      background: #eef4fe;
      padding: 1rem 1.2rem;
      border-radius: 16px;
      margin: 1rem 0;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-weight: 600;
    }
    .summary-bar .total {
      color: #0f3b7a;
      font-size: 1.2rem;
    }
    .submit-order {
      width: 100%;
      padding: 0.9rem;
      background: #0f3b7a;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .submit-order:hover {
      background: #1d4f96;
      transform: scale(1.01);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1d3b5e;
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      display: none;
    }
    .toast.show {
      display: block;
    }

    @media (max-width: 700px) {
      .book-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: stretch; }
      .search-bar { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1><i class="fas fa-book-open"></i> Cambridge Books Orders</h1>
    <div class="header-actions">
      <button class="btn btn-success" onclick="exportOrders()"><i class="fas fa-file-excel"></i> Export Excel</button>
      <button class="btn btn-outline" onclick="clearAllOrders()"><i class="fas fa-trash"></i> Clear All</button>
      <button class="btn btn-primary" onclick="showAllOrders()"><i class="fas fa-list"></i> View Orders</button>
    </div>
  </div>

  <!-- Search & Filter -->
  <div class="search-bar">
    <div class="filter-group">
      <input type="text" id="searchInput" placeholder="🔍 Search levels or books..." oninput="filterLevels()">
      <select id="priceFilter" onchange="filterLevels()">
        <option value="all">All prices</option>
        <option value="low">Low to High</option>
        <option value="high">High to Low</option>
      </select>
    </div>
    <span style="color:#5a6f92; font-size:0.9rem;">
      <i class="fas fa-sync-alt"></i> <span id="levelCount">0</span> levels
    </span>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="number" id="totalOrders">0</div>
      <div class="label">Total Orders</div>
    </div>
    <div class="stat-card">
      <div class="number" id="totalBooks">0</div>
      <div class="label">Books Ordered</div>
    </div>
    <div class="stat-card">
      <div class="number" id="totalRevenue">$0</div>
      <div class="label">Total Revenue</div>
    </div>
  </div>

  <!-- Level Grid -->
  <div id="levelGrid" class="level-grid"></div>
</div>

<!-- Order Modal -->
<div id="orderModal" class="modal-overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <h2><i class="fas fa-shopping-cart"></i> Order Books <span class="level-tag" id="modalLevelTag">Year 1</span></h2>
    <p style="color:#3d5e85; margin-bottom: 1rem;">Select books, set quantities, and enter customer details.</p>

    <div class="form-group">
      <label><i class="fas fa-user"></i> Customer Name *</label>
      <input type="text" id="customerName" placeholder="e.g. Maria Santos">
    </div>
    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Email (for order confirmation)</label>
      <input type="email" id="customerEmail" placeholder="customer@example.com">
    </div>

    <div class="form-group">
      <label><i class="fas fa-list"></i> Books & Quantities</label>
      <div id="bookChecklist" class="book-grid"></div>
    </div>

    <div class="summary-bar">
      <span>Selected: <span id="selectedCount">0</span> books</span>
      <span class="total">Total: $<span id="orderTotal">0.00</span></span>
    </div>

    <button class="submit-order" onclick="submitOrder()">
      <i class="fas fa-check"></i> Place Order
    </button>
    <div style="margin-top:0.8rem; font-size:0.8rem; color:#47648f; text-align:center;">
      Orders stored locally · Email field for confirmation (simulated)
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"><i class="fas fa-check-circle" style="margin-right:10px;"></i> Order placed!</div>

<script>
// ======================== DATA ========================
const bookData = [
  { level: "Year 1", books: [

    "Cambridge Primary Mathematics Learner's Workbook 1",
    "Cambridge Primary English Learner's Book 1",

    "Cambridge Primary Computing Learner's Book 1",

    "Oxford international primary History Work book 1",

    "Oxford international primary Geography Work book 1",
    "Cambridge Primary Global Perspectives Learner's Book 1"
  ]},
  { level: "Year 2", books: [

    "Cambridge Primary Mathematics Learner's Workbook 2",

    "Cambridge Primary English Learner's Workbook 2",
    "Cambridge Primary Science Learner's Book 2",
    "Cambridge Primary Science Learner's Workbook 2",
    "Cambridge Primary Computing Learner's Book 2",
    "Oxford international primary History Learners book 2",
    "Oxford international primary History Work book 2",
    "Oxford international primary Geography Learners book 2",
    "Oxford international primary Geography Work book 2",
    "Cambridge Primary Global Perspectives Learner's Book 2"
  ]},
  { level: "Year 3", books: [
    "Cambridge Primary Mathematics Learner's Book 3",
    "Cambridge Primary Mathematics Learner's Workbook 3",
    "Cambridge Primary English Learner's Book 3",
    "Cambridge Primary English Learner's Workbook 3",
    "Cambridge Primary Science Learner's Book 3",
    "Cambridge Primary Science Learner's Workbook 3",
    "Cambridge Primary Computing Learner's Book 3",
    "Oxford international primary History Learners book 3",
    "Oxford international primary History Work book 3",
    "Oxford international primary Geography Learners book 3",
    "Oxford international primary Geography Work book 3",
    "Cambridge Primary Global Perspectives Learner's Book 3",
    "Swahili For International Schools (International Examinations)"
  ]},
  { level: "Year 4", books: [
    "Cambridge Primary Mathematics Learner's Book 4",

    "Cambridge Primary English Learner's Book 4",
    "Cambridge Primary English Learner's Workbook 4",
    "Cambridge Primary Science Learner's Book 4",
    "Cambridge Primary Science Learner's Workbook 4",
    "Cambridge Primary Computing Learner's Book 4",
    "Oxford international primary History Learners book 4",
    "Oxford international primary History Work book 4",
    "Oxford international primary Geography Learners book 4",
    "Oxford international primary Geography Work book 4",
    "Cambridge Primary Global Perspectives Learner's Book 4",
    "Swahili For International Schools (International Examinations)",
    "Oxford International Primary Atlas",
    "TUKI English- Swahili Dictionary"
  ]},
  { level: "Year 5", books: [
    "Cambridge Primary Mathematics Learner's Book 5",
    "Cambridge Primary Mathematics Learner's Workbook 5",
    "Cambridge Primary English Learner's Book 5",
    "Cambridge Primary English Learner's Workbook 5",
    "Cambridge Primary Science Learner's Book 5",
    "Cambridge Primary Science Learner's Workbook 5",
    "Cambridge Primary Computing Learner's Book 5",
    "Oxford international primary History Learners book 5",
    "Oxford international primary History Work book 5",
    "Oxford international primary Geography Learners book 5",
    "Oxford international primary Geography Work book 5",
    "Cambridge Primary Global Perspectives Learner's Book 5",
    "Swahili For International Schools (International Examinations)",
    "Oxford International Primary Atlas",
    "TUKI English- Swahili Dictionary"
  ]},
  { level: "Year 6", books: [
    "Cambridge Primary Mathematics Learner's Book 6",
    "Cambridge Primary Mathematics Learner's Workbook 6",
    "Cambridge Primary English Learner's Book 6",
    "Cambridge Primary English Learner's Workbook 6",
    "Cambridge Primary Science Learner's Book 6",
    "Cambridge Primary Science Learner's Workbook 6",
    "Cambridge Primary Computing Learner's Book 6",
    "Oxford international primary History Learners book 6",
    "Oxford international primary History Work book 6",
    "Oxford international primary Geography Learners book 6",
    "Oxford international primary Geography Work book 6",
    "Cambridge Primary Global Perspectives Learner's Book 6",
    "Swahili For International Schools (International Examinations)",
    "Oxford International Primary Atlas",
    "TUKI English- Swahili Dictionary"
  ]},
  { level: "Year 7", books: [
    "Cambridge Lower Secondary Mathematics Learner's Book 7",
    "Cambridge Lower Secondary Mathematics Learner's Workbook 7",
    "Cambridge Lower Secondary English Learner's Book 7",
    "Cambridge Lower Secondary English Learner's Workbook 7",
    "Cambridge Lower Secondary Science Learner's Book 7",
    "Cambridge Lower Secondary Science Learner's Workbook 7",
    "Cambridge Lower Secondary Computing Learner's Book 7",
    "Oxford international primary History Learners book 7",
    "Oxford international primary History Work book 7",
    "Oxford IGCSE, A&As Level Geography",
    "Cambridge Lower Secondary Global Perspectives Learner's Book 7",
    "Swahili For International Schools (International Examinations)",
    "TUKI English- Swahili Dictionary",
    "Collins Cambridge IGCSE Student World Atlas"
  ]},
  { level: "Year 8", books: [
    "Cambridge Lower Secondary Complete Mathematics Learner's Book 8",
    "Cambridge Lower Secondary Complete Mathematics Learner's Workbook 8",
    "Cambridge Lower Secondary English Learner's Book 8",
    "Cambridge Lower Secondary English Learner's Workbook 8",
    "Cambridge Lower Secondary Science Learner's Book 8",
    "Cambridge Lower Secondary Science Learner's Workbook 8",
    "Cambridge Lower Secondary Computing Learner's Book 8",
    "Cambridge IGCSE Modern World History",
    "Oxford IGCSE, A&As Level Geography",
    "Cambridge Lower Secondary Global Perspectives Learner's Book 8",
    "Swahili For International Schools (International Examinations)",
    "TUKI English- Swahili Dictionary",
    "Collins Cambridge IGCSE Student World Atlas"
  ]},
  { level: "Year 9", books: [
    "Cambridge Lower Secondary Complete Mathematics Learner's Book 9",
    "Cambridge Lower Secondary Complete Mathematics Learner's Workbook 9",
    "Cambridge Lower Secondary English Learner's Book 9",
    "Cambridge Lower Secondary English Learner's Workbook 9",
    "Cambridge Lower Secondary Science Learner's Book 9",
    "Cambridge Lower Secondary Science Learner's Workbook 9",
    "Cambridge Lower Secondary Computing Learner's Book 8",
    "Cambridge IGCSE Modern World History",
    "Oxford IGCSE, A&As Level Geography",
    "Cambridge Lower Secondary Global Perspectives Learner's Book 9",
    "Swahili For International Schools (International Examinations)",
    "Collins Cambridge IGCSE Student World Atlas",
    "TUKI English- Swahili Dictionary"
  ]},
  { level: "EYFS 2 (Level 3)", books: [
    "Cambridge Early Years Communication and Language 3A",
    "Cambridge Early Years Communication and Language 3B",
    "Cambridge Early Years Communication and Language 3C",
    "Cambridge Early Years Let's Explore Learner's 3A",
    "Cambridge Early Years Let's Explore Learner's 3B",
    "Cambridge Early Years Let's Explore Learner's 3C",
    "Cambridge Early Years Mathematics Learner's 3A",
    "Cambridge Early Years Mathematics Learner's 3B",
    "Cambridge Early Years Mathematics Learner's 3C"
  ]},
  { level: "FS 1 (Level 2)", books: [
    "Cambridge Early Years Communication and Language 2A",
    "Cambridge Early Years Communication and Language 2B",
    "Cambridge Early Years Communication and Language 2C",
    "Cambridge Early Years Learner's Mathematics 2A",
    "Cambridge Early Years Learner's Mathematics 2B",
    "Cambridge Early Years Learner's Mathematics 2C",
    "Cambridge Early Years Let's Explore Learner's 2A",
    "Cambridge Early Years Let's Explore Learner's 2B",
    "Cambridge Early Years Let's Explore Learner's 2C"
  ]}
];

// Price mapping (sample prices)
const bookPrices = {};
bookData.forEach(level => {
  level.books.forEach(title => {
    // Generate consistent pseudo-random price between KES8 and KES45
    let hash = 0;
    for (let i = 0; i < title.length; i++) {
      hash = ((hash << 5) - hash) + title.charCodeAt(i);
      hash |= 0;
    }
    const price = 8 + (Math.abs(hash) % 38);
    bookPrices[title] = Math.round(price * 100) / 100;
  });
});

// ======================== STATE ========================
let currentLevel = '';
let currentBooks = [];
let orderBookStates = {}; // { title: {checked, quantity} }

// ======================== RENDER ========================
function renderLevels(filter = '', priceSort = 'all') {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  let visible = 0;

  let filtered = bookData.filter(level => {
    const match = level.level.toLowerCase().includes(filter.toLowerCase()) ||
                  level.books.some(b => b.toLowerCase().includes(filter.toLowerCase()));
    return match;
  });

  // Price sort (by average book price in level)
  if (priceSort === 'low') {
    filtered.sort((a, b) => {
      const avgA = a.books.reduce((sum, t) => sum + bookPrices[t], 0) / a.books.length;
      const avgB = b.books.reduce((sum, t) => sum + bookPrices[t], 0) / b.books.length;
      return avgA - avgB;
    });
  } else if (priceSort === 'high') {
    filtered.sort((a, b) => {
      const avgA = a.books.reduce((sum, t) => sum + bookPrices[t], 0) / a.books.length;
      const avgB = b.books.reduce((sum, t) => sum + bookPrices[t], 0) / b.books.length;
      return avgB - avgA;
    });
  }

  filtered.forEach(level => {
    visible++;
    const card = document.createElement('div');
    card.className = 'level-card';

    // Book list preview with prices
    let bookHtml = '';
    level.books.slice(0, 8).forEach(title => {
      const price = bookPrices[title] || 0;
      bookHtml += `<div class="book-item"><span>${title}</span><span class="price-tag">$${price.toFixed(2)}</span></div>`;
    });
    if (level.books.length > 8) {
      bookHtml += `<div class="book-item" style="color:#5a6f92;">+ ${level.books.length - 8} more...</div>`;
    }

    card.innerHTML = `
      <div class="level-title">
        ${level.level}
        <span class="book-count">${level.books.length} books</span>
      </div>
      <div class="book-list">${bookHtml}</div>
      <button class="order-btn" onclick="openOrderForm('${level.level}')">
        <i class="fas fa-cart-plus"></i> Order Books
      </button>
    `;
    grid.appendChild(card);
  });

  document.getElementById('levelCount').textContent = visible;
  updateStats();
}

function updateStats() {
  const orders = getOrders();
  document.getElementById('totalOrders').textContent = orders.length;
  let totalBooks = 0, totalRevenue = 0;
  orders.forEach(o => {
    totalBooks += o.items ? o.items.reduce((sum, item) => sum + item.quantity, 0) : 0;
    totalRevenue += o.total || 0;
  });
  document.getElementById('totalBooks').textContent = totalBooks;
  document.getElementById('totalRevenue').textContent = '$' + totalRevenue.toFixed(2);
}

// ======================== SEARCH/FILTER ========================
function filterLevels() {
  const search = document.getElementById('searchInput').value;
  const price = document.getElementById('priceFilter').value;
  renderLevels(search, price);
}

// ======================== ORDER FORM ========================
function openOrderForm(level) {
  const entry = bookData.find(d => d.level === level);
  if (!entry) return;
  currentLevel = level;
  currentBooks = entry.books.slice();
  document.getElementById('modalLevelTag').textContent = level;
  document.getElementById('customerName').value = '';
  document.getElementById('customerEmail').value = '';

  // Build checklist with quantity & price
  const container = document.getElementById('bookChecklist');
  container.innerHTML = '';
  orderBookStates = {};
  currentBooks.forEach(title => {
    const price = bookPrices[title] || 0;
    const row = document.createElement('div');
    row.className = 'book-row';
    row.innerHTML = `
      <input type="checkbox" checked onchange="updateOrderSummary()">
      <span class="book-title">${title}</span>
      <input type="number" class="qty-input" value="1" min="0" max="99" onchange="updateOrderSummary()">
      <span class="price-display">$${price.toFixed(2)}</span>
    `;
    container.appendChild(row);
    orderBookStates[title] = { checked: true, quantity: 1, price: price };
  });

  document.getElementById('orderModal').classList.add('active');
  document.body.style.overflow = 'hidden';
  updateOrderSummary();
}

function closeModal() {
  document.getElementById('orderModal').classList.remove('active');
  document.body.style.overflow = '';
}

function updateOrderSummary() {
  const rows = document.querySelectorAll('#bookChecklist .book-row');
  let total = 0, count = 0;
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    const qty = parseInt(row.querySelector('.qty-input').value) || 0;
    const price = parseFloat(row.querySelector('.price-display').textContent.replace('$', ''));
    if (cb.checked && qty > 0) {
      total += price * qty;
      count += qty;
    }
    // Store state
    const title = row.querySelector('.book-title').textContent;
    orderBookStates[title] = { checked: cb.checked, quantity: qty, price: price };
  });
  document.getElementById('selectedCount').textContent = count;
  document.getElementById('orderTotal').textContent = total.toFixed(2);
}

// ======================== SUBMIT ORDER ========================
function submitOrder() {
  const name = document.getElementById('customerName').value.trim();
  if (!name) {
    alert('Please enter customer name.');
    return;
  }

  const email = document.getElementById('customerEmail').value.trim();
  const items = [];
  let total = 0;

  document.querySelectorAll('#bookChecklist .book-row').forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    const qty = parseInt(row.querySelector('.qty-input').value) || 0;
    const title = row.querySelector('.book-title').textContent;
    const price = parseFloat(row.querySelector('.price-display').textContent.replace('$', ''));
    if (cb.checked && qty > 0) {
      items.push({ title, quantity: qty, price: price });
      total += price * qty;
    }
  });

  if (items.length === 0) {
    alert('Please select at least one book.');
    return;
  }

  const order = {
    customer: name,
    email: email || 'No email provided',
    level: currentLevel,
    items: items,
    total: total,
    timestamp: new Date().toISOString()
  };

  // Save to localStorage
  const orders = getOrders();
  orders.push(order);
  localStorage.setItem('cambridgeOrders', JSON.stringify(orders));

  // Send email notification (simulated)
  if (email) {
    console.log(`📧 Email confirmation sent to ${email} for ${name}'s order`);
    // In production, you'd call an API endpoint here
  }

  showToast(`✅ Order placed for ${name} (${items.length} books, $${total.toFixed(2)})`);
  closeModal();
  renderLevels(document.getElementById('searchInput').value, document.getElementById('priceFilter').value);
}

// ======================== ORDERS MANAGEMENT ========================
function getOrders() {
  return JSON.parse(localStorage.getItem('cambridgeOrders')) || [];
}

function showAllOrders() {
  const orders = getOrders();
  if (orders.length === 0) {
    alert('No orders yet.');
    return;
  }
  let msg = '📋 ALL ORDERS\n\n';
  orders.forEach((o, i) => {
    msg += `#${i+1} ${o.customer} (${o.email || 'no email'})\n`;
    msg += `   Level: ${o.level}\n`;
    o.items.forEach(item => {
      msg += `   • ${item.title} x${item.quantity} = $${(item.price * item.quantity).toFixed(2)}\n`;
    });
    msg += `   Total: $${o.total.toFixed(2)}\n`;
    msg += `   ${new Date(o.timestamp).toLocaleString()}\n\n`;
  });
  alert(msg);
}

function clearAllOrders() {
  if (confirm('Delete all orders permanently?')) {
    localStorage.removeItem('cambridgeOrders');
    renderLevels(document.getElementById('searchInput').value, document.getElementById('priceFilter').value);
    showToast('🗑️ All orders cleared');
  }
}

// ======================== EXPORT EXCEL ========================
function exportOrders() {
  const orders = getOrders();
  if (orders.length === 0) {
    alert('No orders to export.');
    return;
  }

  // Flatten orders for CSV
  let rows = [['Customer', 'Email', 'Level', 'Book', 'Quantity', 'Price', 'Total', 'Date']];
  orders.forEach(o => {
    o.items.forEach(item => {
      rows.push([
        o.customer,
        o.email || '',
        o.level,
        item.title,
        item.quantity,
        item.price.toFixed(2),
        (item.price * item.quantity).toFixed(2),
        new Date(o.timestamp).toLocaleString()
      ]);
    });
  });

  // Also add summary rows
  rows.push([]);
  rows.push(['SUMMARY', '', '', '', '', '', '', '']);
  rows.push(['Total Orders', orders.length, '', '', '', '', '', '']);
  let totalBooks = 0, totalRevenue = 0;
  orders.forEach(o => {
    o.items.forEach(item => { totalBooks += item.quantity; totalRevenue += item.price * item.quantity; });
  });
  rows.push(['Total Books', totalBooks, '', '', '', '', '', '']);
  rows.push(['Total Revenue', '', '', '', '', '', '$' + totalRevenue.toFixed(2), '']);

  let csv = rows.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Cambridge_Orders_${new Date().toISOString().slice(0,10)}.xls`;
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('📥 Orders exported to Excel');
}

// ======================== TOAST ========================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ======================== INIT ========================
renderLevels();
</script>
